name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm build

      - name: Lint
        run: corepack pnpm lint

      - name: Test
        run: corepack pnpm test

      - name: Coverage
        run: corepack pnpm run coverage

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Environment contract
        run: node scripts/check_environment_contract.mjs

      - name: Security scan
        run: corepack pnpm secret:scan

      - name: Dependency security
        run: corepack pnpm dependency:security

      - name: Package
        run: corepack pnpm package

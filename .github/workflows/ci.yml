name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Repository quality gates
        run: |
          pnpm format:check
          pnpm validation
          pnpm dead-code
          pnpm complexity:check
          pnpm thermo-nuclear-simplification

      - name: Security gates
        run: |
          pnpm secret:scan
          pnpm dependency:security

      - name: Pre-PR suite
        run: pnpm pre-pr

      - name: Headless beta workflow
        run: pnpm test:headless-beta

      - name: Cross-client beta parity
        run: pnpm test:beta-parity

      - name: Package
        run: pnpm package
